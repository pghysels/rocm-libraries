# Calibration YAML for fp64 emulation kernel efficiency recalibration.
# 18 shapes × 4 transpose combos = 72 GEMMs.
# File sorted by (transA, transB) so all shapes of each combo appear together.
#
# Shapes per combo (sorted by M, N, K):
#   - Small/medium square: 1K, 2K, 4K (varying K), 8K (varying K), 16K (varying K)
#   - Square 32K²: K=1K, 4K  (regular)
#   - Rectangular: 4K×8K, 8K×4K, 8K×16K, 16K×8K
#   - Large-K (4K² base): K=8K, 16K, 32K
#   - Cubic 32K: cold_iters=2, iters=10  (fewer iterations due to run time)
#
# workspace=200 GiB ensures all 16 moduli fit in one chunk even for 32K² shapes.

